name: Package preview devices

on:
  push:
    branches: ['build/v*-preview.*']

permissions:
  contents: read

concurrency:
  group: preview-device-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-15
          - target: windows-x64
            runner: windows-2025
          - target: linux-x64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and verify unsigned package on the target OS
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: node packaging/build-public-device.mjs "$TARGET" "${GITHUB_REF_NAME#build/v}" out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}-${{ github.sha }}
          path: out/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
